global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon

defaults
    mode                    tcp
    log                     global
    option                  tcplog
    timeout connect         10s
    timeout client          3m
    timeout server          3m
    retries                 3

frontend pgsql_write_front
    bind *:15432
    default_backend pgsql_write_back

frontend pgsql_read_front
    bind *:15433
    default_backend pgsql_read_back

backend pgsql_write_back
    mode tcp
    balance first
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 5s fall 5 rise 2 on-marked-down shutdown-sessions
    server node1 192.168.1.55:5432 check port 8008
    server node2 192.168.1.56:5432 check port 8008
    server node3 192.168.1.57:5432 check port 8008

backend pgsql_read_back
    mode tcp
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 5s fall 5 rise 2 on-marked-down shutdown-sessions
    server node1 192.168.1.55:5432 check port 8008
    server node2 192.168.1.56:5432 check port 8008
    server node3 192.168.1.57:5432 check port 8008

frontend stats
    bind *:8080
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
